name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: release/*.exe
          - name: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac:x64
            artifact: |
              release/*.dmg
              release/*.zip
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac:arm64
            artifact: |
              release/*.dmg
              release/*.zip
          - name: Linux x64
            os: ubuntu-24.04
            command: npm run dist:linux:x64
            artifact: |
              release/*.AppImage
              release/*.deb
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            command: npm run dist:linux:arm64
            artifact: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify portable project packages
        run: npm run test:package

      - name: Verify MP3 encoder
        run: npm run test:mp3

      - name: Build release artifacts
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: HINANA-STUDIO-ECO-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
